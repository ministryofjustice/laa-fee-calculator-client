name: Rubocop
on: 
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  tests:
    name: Run Rubocop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Ruby 3.0
        uses: ruby/setup-ruby@3ff19f5e2baf30647122352b96108b1fbe250c64
        with:
          ruby-version: 3.0
      - name: Bundle
        run: bundle install
      - name: Rubocop
        run: bundle exec rubocop
